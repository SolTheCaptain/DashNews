<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f0a1a">
<title>Дашборд</title>
<style>
:root {
  --bg: #0f0a1a;
  --panel: #1a1230;
  --panel2: #231a40;
  --line: #3a2c60;
  --text: #e6e0f4;
  --muted: #9488b6;
  --gold: #f2c14e;
  --gold-soft: #d9b45f;
  --today: #ff9a3c;
  --up: #6fd39a;
  --down: #ff8f9d;
  --warn: #ffb454;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px 18px 16px;
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(1100px 520px at 85% -8%, #35256455, transparent), var(--bg);
}

header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 {
  margin: 0; color: var(--gold);
  font: 700 1.3rem Georgia, "Times New Roman", serif;
  letter-spacing: .16em; text-transform: uppercase;
  text-shadow: 0 0 18px #f2c14e33;
}
.right { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
h1 #today { color: var(--gold-soft); text-transform: none; letter-spacing: .06em; font-size: 1.15em; }
button {
  cursor: pointer; padding: 5px 14px; border-radius: 999px;
  color: var(--gold); background: #f2c14e12; border: 1px solid #f2c14e66;
  font: 600 12px system-ui, sans-serif;
}
button:hover { background: #f2c14e24; }

main {
  flex: 1; min-height: 0; display: grid; gap: 12px;
  grid-template-columns: minmax(0, .9fr) minmax(0, .9fr) minmax(0, 2.2fr);
  grid-template-rows: repeat(12, minmax(0, 1fr));
  grid-auto-rows: minmax(220px, auto);
}
.card[data-id="football"] { grid-column: 3; grid-row: 1 / span 12; }
.card[data-id="quotes"]  { grid-column: 1; grid-row: 1 / span 4; }
.card[data-id="weather"] { grid-column: 1; grid-row: 5 / span 4; }
.card[data-id="pcgames"] { grid-column: 1; grid-row: 9 / span 4; }
.card[data-id="today"]   { grid-column: 2; grid-row: 1 / span 4; }
.card[data-id="tasks"]   { grid-column: 2; grid-row: 5 / span 3; }
.card[data-id="mtg"]     { grid-column: 2; grid-row: 8 / span 5; }

.card[data-id="football"] { position: relative; background: none; border: none; box-shadow: none; }
.card[data-id="football"] > h2, .card[data-id="football"] > .subs { position: relative; z-index: 1; }
.insets.placed { position: absolute; z-index: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.insets > .card { flex: 1 1 0; min-height: 0; }
.insets > .card[data-id="hockey"] { flex: 2 1 0; }
.insets > .card[data-id="tennis"] { flex: 3 1 0; }
@media (max-width: 999px) { .insets > .card { margin-top: 12px; } }
.card .shape { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible;
  filter: drop-shadow(0 6px 12px #0007); }
.card .shape path { fill: url(#cardGrad); stroke: var(--line); stroke-width: 1; }
.card {
  display: flex; flex-direction: column; min-height: 0;
  padding: 12px 14px;
  background: linear-gradient(165deg, var(--panel2), var(--panel));
  border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 6px 24px #0007;
}
h2, h3 {
  flex: none; margin: 0 0 8px; color: var(--gold);
  font: 700 clamp(.9rem, .95vw, 1.2rem) Georgia, "Times New Roman", serif;
  letter-spacing: .12em; text-transform: uppercase;
}
h2 .t, h2:not(.has-ico) { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .28em; }
h2.has-ico { display: flex; align-items: center; }
.icolink { display: inline-flex; line-height: 0; transition: transform .15s; }
.icolink:hover { transform: scale(1.12); }
h2.has-ico .t { text-box: trim-both cap alphabetic; }
.card[data-id="today"] h2 { color: var(--today); }
h2 .big { font-size: 1.15em; }
h2 .dt { font-size: 1.2em; font-family: "Times New Roman", Times, "Liberation Serif", serif; font-variant-numeric: lining-nums; }
.card[data-id="today"] h2 .t { position: relative; top: .18em; }
.card[data-id="today"] h2 .ico { height: 2.2em; width: 2.2em; margin-top: -.3em; margin-bottom: -.3em; }
.card[data-id="quotes"] .body, .card[data-id="weather"] .body { display: flex; flex-direction: column; }
.card[data-id="quotes"] .body pre, .card[data-id="weather"] .body pre { flex: none; }
.chart .up { color: var(--up); }
.chart .down { color: var(--down); }
.quotes { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.qlist { display: flex; flex-direction: column; gap: 3px; }
.qbtn { text-align: left; font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; color: var(--text);
  padding: 3px 10px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; }
.qbtn:hover:not(:disabled) { background: #f2c14e14; }
.qbtn.on { background: #f2c14e1f; border-color: #f2c14e66; }
.qbtn:disabled { cursor: default; opacity: .75; }
.qbtn .up { color: var(--up); } .qbtn .down { color: var(--down); }
.qchart { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chart { flex: 1; min-height: 70px; display: flex; flex-direction: column; margin-top: 10px; font: 11.5px system-ui, sans-serif; color: var(--muted); }
.chart .ctop { display: flex; align-items: baseline; gap: 6px; }
.chart .ct { color: var(--gold-soft); font-weight: 700; letter-spacing: .06em; margin-right: auto; }
.chart .cv { color: var(--text); font-weight: 600; }
.chart .cbox { position: relative; flex: 1; min-height: 40px; margin: 6px 4px 4px; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart .cdot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px 2px #f2c14e88; }
.chart .wl { position: absolute; transform: translate(-50%, -135%); font-size: 10px; line-height: 1; color: var(--gold-soft); white-space: nowrap; }
.chart .wl.lo { transform: translate(-50%, 45%); color: #5fd3e6; }
.chart .cends.days { font-size: 10px; padding: 0 9px; }
.chart.range .cbox { margin: 8px 16px 4px; }
.chart .cends { display: flex; justify-content: space-between; gap: 8px; }
.chart .cr { color: #8d82ad; }
.todaybody { flex: 1; min-height: 0; overflow: auto; }
.todaybody .tgroup { color: var(--today); font-weight: 700; text-transform: uppercase; font-size: .85em; letter-spacing: .08em; margin-top: 6px; }
.todaybody .tnone { color: var(--muted); }
.todayfoot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.todayfoot button { white-space: nowrap; padding: 5px 12px; }
h2 .ico { flex: none; height: 1.6em; width: 1.6em; margin-left: .8em; }
.card[data-id="quotes"] h2 { margin-bottom: 18px; }
h3.has-ico { display: flex; align-items: center; }
h3.has-ico .t { text-box: trim-both cap alphabetic; }
h3 .ico { flex: none; height: calc(1.6 * clamp(.9rem, .95vw, 1.2rem)); width: auto; margin: -.4em 0 -.4em .8em; }
h3 { font-size: clamp(.78rem, .8vw, 1rem); color: var(--gold-soft); margin-bottom: 6px; }
.body {
  flex: 1; min-height: 0; overflow: auto;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
pre {
  margin: 0; white-space: pre-wrap; color: var(--text);
  font: clamp(12.5px, .8vw, 16px)/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
}
pre .day, .d { color: var(--gold-soft); font-weight: 700; text-transform: uppercase; }
h3.has-ico { margin-bottom: 14px; }
pre .note, pre .th, pre .cut { color: var(--muted); }
pre .cut { font-size: 11px; }
pre .up { color: var(--up); }
pre .down { color: var(--down); }

.foot { flex: none; margin-top: 6px; color: var(--muted); font-size: clamp(11px, .6vw, 13px); }
.warn {
  display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 999px;
  color: var(--warn); background: #ffb45418; border: 1px solid #ffb45455; font-size: 11px;
}

.subs {
  flex: 1; min-height: 0; display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  grid-template-rows: minmax(0, auto) minmax(0, 1fr);
}
.sub {
  display: flex; flex-direction: column; min-height: 0; padding: 9px 11px;
  background: #ffffff08; border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 1000px) { .card[data-id="football"] > .subs { grid-template-rows: minmax(54%, max-content) minmax(0, 1fr); } }
.card[data-id="mtg"] .subs { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 3fr) minmax(0, 6fr); }
.card[data-id="mtg"] .sub h3, .sub[data-id="next"] h3, .sub[data-id="ucl"] h3 .t, .sub[data-id="ucl-next"] h3, .sub[data-id="ucl-table"] h3 { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 1px; text-underline-offset: .28em; }
.sub[data-id="ucl"] { grid-column: 2; grid-row: 1 / span 2; }
.subs.inner { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, max-content) minmax(0, 1fr); }
.matches { display: flex; flex-direction: column; gap: 14px; }
.match { font: clamp(12.5px, .8vw, 16px)/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
.match .vs { display: flex; flex-wrap: wrap; align-items: center; gap: .3em .4em; margin-bottom: 2px; }
.match .vs img.em-real { height: calc(1.75 * clamp(.9rem,.95vw,1.2rem)); transform: translateY(-.4em); }
.match .vs img.em-manutd { transform: translateY(-.2em); }
.match .vs .opp { display: inline-flex; align-items: center; gap: .4em; white-space: nowrap; }
.match .vs .opp .bd { transform: translateY(.3em); }
.match .vs .opp img { height: calc(1.44 * clamp(.9rem, .95vw, 1.2rem)); }
.match .vs img { height: calc(1.6 * clamp(.9rem, .95vw, 1.2rem)); width: auto; max-width: 3.4em; object-fit: contain; flex: none; }
.match .vs .v { color: var(--gold-soft); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.match .vs .n { color: var(--text); font-weight: 700; text-transform: uppercase; }
.match .when { color: var(--text); }
.match .where { color: var(--muted); }
.match details.rnd { margin-top: 6px; }
.match details.rnd summary { cursor: pointer; color: var(--gold-soft); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; list-style: none; }
.match details.rnd summary::-webkit-details-marker { display: none; }
.match details.rnd summary::before { content: "▸ "; }
.match details.rnd[open] summary::before { content: "▾ "; }
.match details.rnd pre { margin-top: 4px; white-space: pre; }
.match .lbl { color: var(--gold-soft); font-weight: 700; text-transform: uppercase; }
.sub[data-id="ucl-table"] pre { white-space: pre; }

@media (max-width: 999px) {
  html, body { height: auto; }
  main { display: flex; flex-direction: column; }
  .card { grid-column: auto !important; grid-row: auto !important; }
  .subs { display: flex; flex-direction: column; }
  .body { overflow: visible; }
  .sub[data-id="ucl-table"] .body { overflow-x: auto; }
  .subs.inner { display: flex; flex-direction: column; }
  header { flex-wrap: wrap; }
}
</style>
</head>

let TODAY = null; // {d, m, y} в часовом поясе дашборда
function setToday(tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: tz, day: "numeric", month: "numeric", year: "numeric" })
    .formatToParts(new Date()).map(x => [x.type, +x.value]));
  TODAY = { d: p.day, m: p.month, y: p.year };
  today.textContent = new Date().toLocaleDateString("ru-RU", {
    timeZone: tz, day: "numeric", month: "long", year: "numeric",
  }).replace(/\s*г\.$/, "");
}
setToday("Europe/Moscow");

function fmt(iso, tz) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("ru-RU", {
    timeZone: tz, day: "numeric", month: "long", hour: "2-digit", minute: "2-digit",
  });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Текст блока построчно; подсветка по виду строки, всё через textContent
// Даты вида «ср, 28 октября», «3 ноября», «12 октября 2026»: единый стиль, сегодняшняя — оранжевая
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const DATE_RE = new RegExp("(?:(?:пн|вт|ср|чт|пт|сб|вс), )?(\\d{1,2}) (" + MON.join("|") + ")(?: (\\d{4}))?", "gi");
function dateNodes(text) {
  const out = [];
  let last = 0, m;
  DATE_RE.lastIndex = 0;
  while ((m = DATE_RE.exec(text))) {
    out.push(text.slice(last, m.index));
    out.push(el("span", "d", m[0]));
    last = m.index + m[0].length;
  }
  out.push(text.slice(last));
  return out.filter(x => x !== "");
}

function fillPre(pre, lines) {
  lines.forEach((line, i) => {
    if (i) pre.append("\n");
    let cls = "";
    if (/^[А-ЯЁ]{2}, \d/.test(line)) cls = "day";
    else if (/^---/.test(line)) cls = "cut";
    else if (/^#\s/.test(line)) cls = "th";
    else if (/^(время по |данные:|USD, EUR:)/.test(line)) cls = "note";
    if (cls === "day") { pre.append(...dateNodes(line)); return; }
    if (cls) { pre.append(el("span", cls, line)); return; }
    const m = line.match(/^(.*)\(([+\-−]\d+(?:,\d+)?%)\)(.*)$/);
    if (m) {
      pre.append(m[1] + "(", el("span", m[2][0] === "+" ? "up" : "down", m[2]), ")" + m[3]);
    } else {
      pre.append(...dateNodes(line));
    }
  });
}

// Эмблема с запасными вариантами: /small у TheSportsDB → оригинал → текстовое название
function badgeEl(url, fallbackText) {
  const wrap = el("span", "bd");
  const img = el("img");
  img.alt = fallbackText || "";
  img.referrerPolicy = "no-referrer";
  let step = 0;
  const tries = [url + "/small", url];
  img.onerror = () => {
    step++;
    if (step < tries.length) { img.src = tries[step]; return; }
    wrap.textContent = fallbackText || "";
  };
  img.src = tries[0];
  wrap.append(img);
  return wrap;
}

function matchesEl(matches) {
  const box = el("div", "matches");
  for (const m of matches) {
    const item = el("div", "match");
    if (m.error) {
      item.append(el("div", "lbl", m.label), el("div", "when", m.error));
      box.append(item);
      continue;
    }
    const vs = el("div", "vs");
    vs.append(el("span", "lbl", m.label + (m.own.rank ? " (" + m.own.rank + ")" : "")));
    const own = m.emblem && EMBLEMS[m.emblem];
    if (own) { const i = el("img"); i.className = "em-" + m.emblem; i.src = own; i.alt = m.own.name; vs.append(i); }
    else if (m.own.badge) vs.append(badgeEl(m.own.badge, ""));
    vs.append(el("span", "v", "vs"));
    const opp = el("span", "opp");
    if (m.opp.badge) opp.append(badgeEl(m.opp.badge, m.opp.name));
    opp.append(el("span", "n", m.opp.name + (m.opp.rank ? " (" + m.opp.rank + ")" : "")));
    vs.append(opp);
    item.append(vs);
    if (m.when) { const w = el("div", "when"); w.append(...dateNodes(m.when)); item.append(w); }
    if (m.where) item.append(el("div", "where", m.where));
    if (m.round && m.round.lines && m.round.lines.length) {
      const dt = el("details", "rnd");
      dt.append(el("summary", "", m.round.title.toUpperCase()));
      const pre = el("pre"); fillPre(pre, m.round.lines); dt.append(pre);
      item.append(dt);
    }
    box.append(item);
  }
  return box;
}

function warnEl(item) {
  return el("span", "warn", "⚠ не обновилось: " + item.error + " — показаны прошлые данные");
}

// График курса: линия и заливка в SVG, подписи обычным текстом, чтобы не растягивались
function rangeChartEl(ch) {
  const pts = (ch.points || []).filter(p => p.hi != null && p.lo != null);
  if (pts.length < 2) return null;
  const NS = "http://www.w3.org/2000/svg";
  const hi = Math.max(...pts.map(p => p.hi)), lo = Math.min(...pts.map(p => p.lo));
  const pad = (hi - lo || 1) * 0.15, ymin = lo - pad, ymax = hi + pad;
  const X = i => (i / (pts.length - 1)) * 100;
  const Y = v => 100 - ((v - ymin) / (ymax - ymin)) * 100;
  const path = key => pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(2) + "," + Y(p[key]).toFixed(2)).join("");
  const back = pts.map((p, i) => "L" + X(pts.length - 1 - i).toFixed(2) + "," + Y(pts[pts.length - 1 - i].lo).toFixed(2)).join("");
  const sg = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v)) + "°";
  const wrap = el("div", "chart range");
  const top = el("div", "ctop");
  top.append(el("span", "ct", ch.title || ""), el("span", "cv", sg(lo) + " … " + sg(hi)));
  const box = el("div", "cbox");
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("preserveAspectRatio", "none");
  const zero = (ymin < 0 && ymax > 0) ? '<line x1="0" x2="100" y1="' + Y(0).toFixed(2) + '" y2="' + Y(0).toFixed(2) + '" stroke="#8d82ad" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity=".6"/>' : "";
  svg.innerHTML = '<defs><linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c14e" stop-opacity=".32"/><stop offset="1" stop-color="#04b9d4" stop-opacity=".22"/></linearGradient></defs>' +
    zero + '<path d="' + path("hi") + back + 'Z" fill="url(#wfill)"/>' +
    '<path d="' + path("hi") + '" fill="none" stroke="#f2c14e" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
    '<path d="' + path("lo") + '" fill="none" stroke="#04b9d4" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
  box.append(svg);
  pts.forEach((p, i) => {   // подписи максимума над линией, минимума под ней — через одну, чтобы не слипались
    if (i % 2 && i !== pts.length - 1) return;
    const a = el("span", "wl hi", sg(p.hi)); a.style.left = X(i) + "%"; a.style.top = Y(p.hi) + "%";
    const b = el("span", "wl lo", sg(p.lo)); b.style.left = X(i) + "%"; b.style.top = Y(p.lo) + "%";
    box.append(a, b);
  });
  const ends = el("div", "cends days");
  const WDS = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
  pts.forEach(p => { const d = new Date(p.d + "T00:00:00Z"); ends.append(el("span", "", WDS[d.getUTCDay()])); });
  wrap.append(top, box, ends);
  return wrap;
}

function chartEl(ch) {
  if (ch.kind === "range") return rangeChartEl(ch);
  const pts = (ch.points || []).map(p => ({ t: Date.parse(p.d + "T00:00:00Z"), v: p.v, d: p.d }));
  if (pts.length < 2) return null;
  const NS = "http://www.w3.org/2000/svg";
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo || hi * 0.01) * 0.18;
  const ymin = lo - pad, ymax = hi + pad;
  const X = p => (t1 === t0 ? 50 : ((p.t - t0) / (t1 - t0)) * 100);
  const Y = p => 100 - ((p.v - ymin) / (ymax - ymin)) * 100;
  const line = pts.map((p, i) => (i ? "L" : "M") + X(p).toFixed(2) + "," + Y(p).toFixed(2)).join("");
  const wrap = el("div", "chart");
  const top = el("div", "ctop");
  const last = pts[pts.length - 1], first = pts[0];
  const chg = (last.v / first.v - 1) * 100;
  const fv = v => v >= 1000 ? Math.round(v).toLocaleString("ru-RU") : v.toFixed(2).replace(".", ",");
  top.append(el("span", "ct", ch.title || ""),
    el("span", "cv", fv(last.v) + " " + (ch.cur || "₽") + " "),
    el("span", chg >= 0 ? "up" : "down", (chg >= 0 ? "+" : "−") + Math.abs(chg).toFixed(1).replace(".", ",") + "%"));
  const box = el("div", "cbox");
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("preserveAspectRatio", "none");
  svg.innerHTML = '<defs><linearGradient id="cfill" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#f2c14e" stop-opacity=".38"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + line + 'L100,100L0,100Z" fill="url(#cfill)"/>' +
    '<path d="' + line + '" fill="none" stroke="#f2c14e" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
  box.append(svg);
  const dot = el("span", "cdot");
  dot.style.left = X(last) + "%"; dot.style.top = Y(last) + "%";
  box.append(dot);
  const ends = el("div", "cends");
  const lab = d => { const [y, m, dd] = d.split("-"); return +dd + " " + MON[+m - 1].slice(0, 3); };
  ends.append(el("span", "", lab(first.d)), el("span", "cr", "мин " + fv(lo) + " · макс " + fv(hi)), el("span", "", lab(last.d)));
  wrap.append(top, box, ends);
  return wrap;
}

// Котировки кнопками: нажатие переключает график под ними
let quoteSel = "USD";
function quotesEl(c) {
  const wrap = el("div", "quotes");
  const codeOf = l => (l.match(/^[A-Z]{3}/) || [""])[0];
  const list = el("div", "qlist"), holder = el("div", "qchart");
  if (!c.charts[quoteSel]) quoteSel = Object.keys(c.charts)[0];
  const show = () => {
    holder.replaceChildren();
    const ch = c.charts[quoteSel] && chartEl(c.charts[quoteSel]);
    if (ch) holder.append(ch);
    list.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.code === quoteSel));
  };
  for (const line of c.lines) {
    const code = codeOf(line);
    const b = el("button", "qbtn");
    b.dataset.code = code;
    b.type = "button";
    if (!c.charts[code]) b.disabled = true;
    const sp = el("span", "mono"); fillPre(sp, [line]); b.append(sp);
    b.onclick = () => { quoteSel = code; show(); };
    list.append(b);
  }
  wrap.append(list, holder);
  show();
  return wrap;
}

function subEl(s) {
  const sub = el("div", "sub");
  sub.dataset.id = s.id;
  const h3 = el("h3");
  if (SUBICONS[s.id]) {
    const im = el("img", "ico"); im.src = SUBICONS[s.id]; im.alt = "";
    h3.className = "has-ico"; h3.append(el("span", "t", s.title), im);
  } else h3.textContent = s.title;
  sub.append(h3);
  if (s.sections) {  // вложенный блок: подблоки внутри подблока
    const inner = el("div", "subs inner");
    for (const x of s.sections) inner.append(subEl(x));
    sub.append(inner);
    return sub;
  }
  const sb = el("div", "body");
  if (s.matches && s.matches.length) {
    sb.append(matchesEl(s.matches));
  } else {
    const pre = el("pre");
    fillPre(pre, s.lines && s.lines.length ? s.lines : ["Нет данных."]);
    sb.append(pre);
  }
  if (!s.ok) sb.append(warnEl(s));
  sub.append(sb);
  return sub;
}

// Всё, что назначено на сегодня, собирается в карточку «Сегодня»
const DATE_SRC = DATE_RE.source;
function isTodayMatch(m) {
  return TODAY && +m[1] === TODAY.d && MON.indexOf(m[2].toLowerCase()) + 1 === TODAY.m && (!m[3] || +m[3] === TODAY.y);
}
function lineToday(line) {
  const re = new RegExp(DATE_SRC, "i");
  const m = line.match(re);
  return m && isTodayMatch(m) ? m : null;
}
function stripDate(line) {
  return line.replace(new RegExp(",? ?" + DATE_SRC, "i"), "").replace(/^[\s,—-]+/, "").replace(/\s+[—-]\s*$/, "").trim();
}
function todayFromLines(lines) {
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim() || /^(время по |данные:|---|#\s)/.test(line)) continue;
    if (/^[А-ЯЁ]{2}, \d/.test(line)) {              // заголовок дня: берём отступные строки под ним
      if (lineToday(line)) while (i + 1 < lines.length && /^\s+\S/.test(lines[i + 1])) out.push(lines[++i].trim());
      continue;
    }
    if (lineToday(line)) out.push(stripDate(line));
  }
  return out;
}
function collectToday(cards) {
  const groups = [];
  const add = (label, lines) => { if (lines.length) groups.push({ label, lines }); };
  const walk = (node, label) => {
    if (node.sections) { for (const x of node.sections) walk(x, x.sections ? label : label + " · " + x.title); return; }
    const ls = node.matches && node.matches.length ? [] : todayFromLines(node.lines || []);
    for (const m of node.matches || []) {
      const w = (m.when || "").match(new RegExp(DATE_SRC, "i"));
      if (w && isTodayMatch(w)) {
        const t = (m.when.match(/\d{1,2}:\d{2}/) || [""])[0];
        const a = m.own.name, b = m.opp.name;
        ls.push(`${m.home === false ? b + " — " + a : a + " — " + b}${t ? ", " + t : ""}`);
      }
    }
    add(label, ls);
  };
  for (const c of cards) walk(c, c.title);
  return groups;
}

function render(data) {
  const tz = data.timezone || "Europe/Moscow";
  setToday(tz);
  root.innerHTML = "";
  {  // карточка «Сегодня» над задачами: пока без содержимого
    const t = el("section", "card");
    t.dataset.id = "today";
    const h = el("h2");
    h.className = "has-ico";
    const im = el("img", "ico"); im.src = ICONS.today; im.alt = "";
    const tt = el("span", "t");
    tt.append(el("span", "big", "Сегодня "));
    const dt = el("span", "dt");
    dt.append(new Date().toLocaleDateString("ru-RU", {day: "2-digit", month: "2-digit", year: "2-digit"}));
    tt.append(dt);
    h.append(tt, im);
    const tb = el("div", "todaybody");
    const groups = collectToday(data.cards);
    if (!groups.length) tb.append(el("div", "tnone", "На сегодня ничего нет."));
    for (const g of groups) {
      tb.append(el("div", "tgroup", g.label));
      const pre = el("pre"); fillPre(pre, g.lines.map(x => "  " + x)); tb.append(pre);
    }
    const ft = el("div", "todayfoot");
    ft.append(stamp, reloadBtn);
    t.append(h, tb, ft);
    root.append(t);
  }
  for (const c of data.cards) {
    const card = el("section", "card");
    card.dataset.id = c.id;
    const h2 = el("h2");
    if (ICONS[c.id]) {
      const img = el("img", "ico");
      img.src = ICONS[c.id];
      img.alt = "";
      h2.className = "has-ico";
      const link = ICON_LINKS[c.id];
      if (link) {
        const a = el("a", "icolink"); a.href = link; a.target = "_blank"; a.rel = "noopener"; a.title = "Открыть таблицу";
        a.append(img);
        h2.append(el("span", "t", c.title), a);
      } else h2.append(el("span", "t", c.title), img);
    } else {
      h2.textContent = c.title;
    }
    card.append(h2);
    const body = el("div", c.sections ? "subs" : "body");
    if (c.sections) {
      for (const s of c.sections) body.append(subEl(s));
    } else if (c.matches && c.matches.length) {
      body.append(matchesEl(c.matches));
      if (!c.ok) body.append(warnEl(c));
    } else {
      if (c.charts && c.id === "quotes" && c.lines && c.lines.length) {
        body.append(quotesEl(c));
      } else {
        const pre = el("pre");
        fillPre(pre, c.lines && c.lines.length ? c.lines : ["Нет данных."]);
        body.append(pre);
        const w = c.charts && c.charts.weather && chartEl(c.charts.weather);
        if (w) body.append(w);
      }
      if (!c.ok) body.append(warnEl(c));
    }
    card.append(body);
    const fb = (c.id === "hockey" || c.id === "tennis") && root.querySelector('.card[data-id="football"]');
    if (fb) {  // хоккей и теннис встают в вырез рамки футбола
      let box = fb.querySelector(":scope > .insets");
      if (!box) { box = el("div", "insets"); fb.append(box); }
      if (c.id === "hockey") box.prepend(card); else box.append(card);
      if (fb._draw) fb._draw();
    } else root.append(card);
    if (c.id === "football") shapeCard(card);
  }
  stamp.textContent = "данные собраны " + fmt(data.updated, tz);
}

// Футбол: внешняя рамка не прямоугольник, а обходит пустое место слева внизу (под «Ближайшим матчем»)
function shapeCard(card) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "shape");
  svg.innerHTML = '<defs><linearGradient id="cardGrad" x1=".25" y1="0" x2=".75" y2="1">' +
    '<stop offset="0" style="stop-color:var(--panel2)"/><stop offset="1" style="stop-color:var(--panel)"/></linearGradient></defs><path/>';
  card.prepend(svg);
  const path = svg.querySelector("path");
  const draw = () => {
    const a = card.querySelector('.sub[data-id="next"]'), b = card.querySelector('.sub[data-id="ucl"]');
    const w = card.clientWidth, h = card.clientHeight, r = 14;
    svg.setAttribute("width", w); svg.setAttribute("height", h);
    const inset = card.querySelector(":scope > .insets");
    const place = (x, y) => {   // x, y — угол выреза; без выреза теннис остаётся обычной карточкой
      if (!inset) return;
      inset.classList.toggle("placed", x != null);
      if (x == null) { inset.style.cssText = ""; return; }
      inset.style.left = "0"; inset.style.bottom = "0"; inset.style.top = (y + 12) + "px"; inset.style.width = (x - 12) + "px";
    };
    if (!a || !b || innerWidth < 1000) { svg.style.display = "none"; place(null); return; }
    svg.style.display = "";
    const c = card.getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const pad = ra.left - c.left;                       // тот же отступ, что слева у карточки
    const xc = Math.round(rb.left - c.left - pad);  // правый край «вырезанной» зоны
    const yc = Math.round(ra.bottom - c.top + pad);     // верх «вырезанной» зоны
    const cut = !(yc > h - 3 * r || xc < 3 * r);
    place(cut ? xc : null, yc);
    if (!cut) { path.setAttribute("d", `M${r},.5H${w - r}Q${w - .5},.5 ${w - .5},${r}V${h - r}Q${w - .5},${h - .5} ${w - r},${h - .5}H${r}Q.5,${h - .5} .5,${h - r}V${r}Q.5,.5 ${r},.5Z`); return; }
    path.setAttribute("d",
      `M${r},.5H${w - r}Q${w - .5},.5 ${w - .5},${r}V${h - r}Q${w - .5},${h - .5} ${w - r},${h - .5}` +
      `H${xc + r}Q${xc},${h - .5} ${xc + .5},${h - r}V${yc + r}Q${xc + .5},${yc} ${xc - r},${yc}` +
      `H${r}Q.5,${yc} .5,${yc - r}V${r}Q.5,.5 ${r},.5Z`);
  };
  card._draw = draw;
  new ResizeObserver(draw).observe(card);
  card.querySelectorAll(".sub").forEach(x => new ResizeObserver(draw).observe(x));
  draw();
}

async function load() {
  stamp.textContent = "загрузка…";
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    root.textContent = "Не удалось загрузить data.json: " + e.message +
      " (страницу нужно открывать по ссылке GitHub Pages, а не файлом с диска)";
    stamp.textContent = "";
  }
}

reloadBtn.onclick = load;
setInterval(load, 10 * 60 * 1000);
load();
</script>
